# Notenn production on the VPS, behind the existing Traefik.
# From this folder:  docker compose up -d --build
# Variables: see .env.example (copy to .env).

name: notenn
# Fixed container names (notenn-web, not notenn-web-1): one instance per service.

services:
  web:
    container_name: notenn-web
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    # Built and pushed by GitHub Actions; deploy.sh picks the exact version (sha-<commit>).
    # `docker compose up -d --build` still builds it here when needed.
    image: ${WEB_IMAGE:-ghcr.io/ampynjord/notenn-web:latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://notenn:${POSTGRES_PASSWORD:?must be set in .env}@db:5432/notenn
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?must be set in .env}
      # Links in e-mails and the only origin allowed to use the session cookie.
      PUBLIC_URL: https://${DOMAIN:-notenn.ampynjord.bzh}
      # Account e-mails (confirmation, password) through Resend, see README.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-notenn@ampynjord.bzh}
      # Visit statistics (optional): filled in once Umami is running, see README.
      UMAMI_SCRIPT_URL: ${UMAMI_SCRIPT_URL:-}
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
    volumes:
      - media:/data/media
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik-network}
      - traefik.http.routers.notenn.rule=Host(`${DOMAIN:-notenn.ampynjord.bzh}`)
      - traefik.http.routers.notenn.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.notenn.tls=true
      - traefik.http.routers.notenn.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.services.notenn.loadbalancer.server.port=3000
      # Security headers
      - traefik.http.routers.notenn.middlewares=notenn-entetes
      - traefik.http.middlewares.notenn-entetes.headers.stsSeconds=31536000
      - traefik.http.middlewares.notenn-entetes.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.notenn-entetes.headers.contentTypeNosniff=true
      - traefik.http.middlewares.notenn-entetes.headers.frameDeny=true
      - traefik.http.middlewares.notenn-entetes.headers.referrerPolicy=strict-origin-when-cross-origin

  db:
    container_name: notenn-db
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: notenn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?must be set in .env}
      POSTGRES_DB: notenn
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notenn -d notenn"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  # Daily backup of the database and media into ./backups, kept ${BACKUP_KEEP_DAYS} days.
  backup:
    container_name: notenn-backup
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: notenn
      PGPASSWORD: ${POSTGRES_PASSWORD:?must be set in .env}
      PGDATABASE: notenn
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - media:/data/media:ro
      - ./backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  # Visit statistics without cookies (optional): docker compose --profile stats up -d
  umami:
    container_name: notenn-umami
    profiles: [stats]
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:-}@umami-db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:-}
      DISABLE_TELEMETRY: 1
    depends_on:
      umami-db:
        condition: service_healthy
    networks:
      - stats
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik-network}
      - traefik.http.routers.notenn-stats.rule=Host(`${STATS_DOMAIN:-stats.ampynjord.bzh}`)
      - traefik.http.routers.notenn-stats.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.notenn-stats.tls=true
      - traefik.http.routers.notenn-stats.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.services.notenn-stats.loadbalancer.server.port=3000

  umami-db:
    container_name: notenn-umami-db
    profiles: [stats]
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:-}
      POSTGRES_DB: umami
    volumes:
      - umamidata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - stats

volumes:
  pgdata:
  media:
  umamidata:

networks:
  internal:
  stats:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik-network}
