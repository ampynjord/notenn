# Production de Notenn sur le VPS, derrière le Traefik existant.
# Depuis ce dossier :  docker compose up -d --build
# Variables : voir .env.example (copier en .env).

name: notenn

services:
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    image: notenn-web:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://notenn:${POSTGRES_PASSWORD:?à définir dans .env}@db:5432/notenn
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?à définir dans .env}
    volumes:
      - media:/data/media
    depends_on:
      db:
        condition: service_healthy
    networks:
      - interne
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik}
      - traefik.http.routers.notenn.rule=Host(`${DOMAIN:-notenn.ampynjord.bzh}`)
      - traefik.http.routers.notenn.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.notenn.tls=true
      - traefik.http.routers.notenn.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.services.notenn.loadbalancer.server.port=3000
      # En-têtes de sécurité
      - traefik.http.routers.notenn.middlewares=notenn-entetes
      - traefik.http.middlewares.notenn-entetes.headers.stsSeconds=31536000
      - traefik.http.middlewares.notenn-entetes.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.notenn-entetes.headers.contentTypeNosniff=true
      - traefik.http.middlewares.notenn-entetes.headers.frameDeny=true
      - traefik.http.middlewares.notenn-entetes.headers.referrerPolicy=strict-origin-when-cross-origin

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: notenn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?à définir dans .env}
      POSTGRES_DB: notenn
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notenn -d notenn"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - interne

  # Sauvegarde quotidienne de la base et des médias dans ./sauvegardes, gardée ${BACKUP_KEEP_DAYS} jours.
  sauvegarde:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: notenn
      PGPASSWORD: ${POSTGRES_PASSWORD:?à définir dans .env}
      PGDATABASE: notenn
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./sauvegardes:/sauvegardes
      - media:/data/media:ro
      - ./sauvegarde.sh:/sauvegarde.sh:ro
    entrypoint: ["sh", "/sauvegarde.sh"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - interne

volumes:
  pgdata:
  media:

networks:
  interne:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}
