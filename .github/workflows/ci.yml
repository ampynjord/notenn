# Checks every branch and pull request; on main, also builds the image and deploys it.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  NEXT_TELEMETRY_DISABLED: '1'
  IMAGE: ghcr.io/ampynjord/notenn-web

jobs:
  checks:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm --filter @notenn/web lint
      - name: Unit tests (engine, notation, import, web)
        run: pnpm test
      - name: Deployment files
        run: |
          sh -n deploy/deploy.sh deploy/backup.sh
          cp deploy/.env.example deploy/.env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=x/; s/^PAYLOAD_SECRET=.*/PAYLOAD_SECRET=x/' deploy/.env
          docker compose -f deploy/docker-compose.yml config --quiet
          docker compose -f deploy/docker-compose.yml --profile stats config --quiet

  database:
    name: Migrations, integration and browser tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: notenn
          POSTGRES_PASSWORD: notenn
          POSTGRES_DB: notenn
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U notenn"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://notenn:notenn@localhost:5432/notenn
      PAYLOAD_SECRET: ci-only-secret
      PUBLIC_URL: http://localhost:3000
      # Tests run on the schema built by the migrations, never on one pushed from the code.
      PAYLOAD_DB_PUSH: 'false'
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The same migrations as production, on an empty database (catches a migration that only
      # works on an existing base).
      - name: Migrations on an empty database
        run: pnpm payload migrate
        env:
          NODE_ENV: production
      - name: Integration tests (access rules, accounts, libraries)
        run: pnpm test:int
      - name: Build
        run: pnpm build
      - name: Browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests (site and administration)
        run: pnpm test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  image:
    name: Build and push the image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, database]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
          provenance: false

  deploy:
    name: Deploy to the VPS
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://notenn.ampynjord.bzh
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      # Until the SSH key is in the repository secrets (deploy/README.md, section 4), the image
      # is still published but nothing is deployed.
      - name: Deployment configured?
        id: configured
        env:
          KEY: ${{ secrets.NOTENN_DEPLOY_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          if [ -n "$KEY" ] && [ -n "$HOST" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::NOTENN_DEPLOY_KEY or VPS_HOST missing: deployment skipped (deploy/README.md, section 4)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.configured.outputs.ready == 'true'
        with:
          sparse-checkout: .github/scripts
      - name: Deploy over SSH
        if: steps.configured.outputs.ready == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.NOTENN_DEPLOY_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '2222' }}
          VPS_USER: ${{ secrets.VPS_USER || 'debian' }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          TAG: ${{ needs.image.outputs.tag }}
          SHA: ${{ github.sha }}
        run: .github/scripts/ssh-deploy.sh
      - name: Check the public site
        if: steps.configured.outputs.ready == 'true'
        run: |
          for i in $(seq 1 12); do
            if curl -fsS https://notenn.ampynjord.bzh/healthz; then exit 0; fi
            sleep 5
          done
          exit 1
